<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 960" width="880" height="960" role="img" aria-labelledby="t d">
  <title id="t">How /teamwork works</title>
  <desc id="d">You run /teamwork with a goal. The team lead plans, picks a team from the roster, delegates in parallel to members who each keep a log, reviews handoffs, gets a QA verdict and reports back to you. Members escalate to the lead, and the lead to you.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#57606a"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a5b00"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:#1f2328}
      .b{font-weight:600}
      .m{fill:#57606a;font-size:14px}
      .f{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#1f2328}
      .lead{fill:#e3f1ee;stroke:#0f6b5c;stroke-width:1.5}
      .mem{fill:#fff;stroke:#b8b3a8;stroke-width:1.5}
      .chip{fill:#f0ede6}
      .ln{stroke:#57606a;stroke-width:1.75;fill:none}
      .esc{stroke:#9a5b00;stroke-width:2;fill:none;stroke-dasharray:6 5}
      .ct{stroke:#b8b3a8;stroke-width:1.25;fill:none}
    </style>
  </defs>
  <rect width="880" height="960" rx="16" fill="#faf9f7"/>

  <!-- user -->
  <rect class="mem" x="110" y="24" width="500" height="70" rx="12"/>
  <text class="b" x="130" y="52">You: /teamwork &lt;goal&gt;</text>
  <text class="m" x="130" y="77">optionally a team size and roles: "team of 3", "with QA"</text>
  <path class="ln" d="M360,94 V126" marker-end="url(#a)"/>

  <!-- 1 plan -->
  <rect class="lead" x="110" y="128" width="500" height="64" rx="12"/>
  <text class="b" x="130" y="154">1  Team lead restates the goal and plans</text>
  <text class="m" x="130" y="177">main session; tasks, owners, order, done-when</text>
  <path class="ct" d="M610,160 H652"/>
  <rect class="chip" x="652" y="134" width="216" height="52" rx="8"/>
  <text class="f" x="666" y="156">.teamwork/plans/</text>
  <text class="m" x="666" y="176">the plan, shown to you</text>
  <path class="ln" d="M360,192 V222" marker-end="url(#a)"/>

  <!-- 2 roster -->
  <rect class="lead" x="110" y="224" width="500" height="84" rx="12"/>
  <text class="b" x="130" y="250">2  Team lead picks the team from the roster</text>
  <text class="m" x="130" y="273">7 built-in roles + custom members in .claude/agents/</text>
  <text class="m" x="130" y="294">your size and roles are honored; else the smallest fit</text>
  <path class="ct" d="M610,266 H652"/>
  <rect class="chip" x="652" y="240" width="216" height="52" rx="8"/>
  <text class="f" x="666" y="262">/teamwork:hire</text>
  <text class="m" x="666" y="282">adds a custom member</text>
  <path class="ln" d="M360,308 V340" marker-end="url(#a)"/>

  <!-- 3 delegate -->
  <rect class="mem" x="110" y="342" width="500" height="162" rx="12"/>
  <path class="lead" d="M110,354 a12,12 0 0 1 12,-12 H598 a12,12 0 0 1 12,12 V398 H110 z"/>
  <text class="b" x="130" y="367">3  Team lead delegates in parallel</text>
  <text class="m" x="130" y="388">self-contained brief and a model chosen per task</text>
  <g>
    <rect class="mem" x="120" y="410" width="156" height="86" rx="10"/>
    <text class="b" x="130" y="432" style="font-size:14px">product-manager</text>
    <text class="f" x="130" y="454">.teamwork/logs/</text>
    <text class="f" x="130" y="474">product-manager/</text>
    <rect class="mem" x="282" y="410" width="156" height="86" rx="10"/>
    <text class="b" x="292" y="432" style="font-size:14px">software-engineer</text>
    <text class="f" x="292" y="454">.teamwork/logs/</text>
    <text class="f" x="292" y="474">software-engineer/</text>
    <rect class="mem" x="444" y="410" width="156" height="86" rx="10"/>
    <text class="b" x="454" y="432" style="font-size:14px">ui-ux-engineer</text>
    <text class="f" x="454" y="454">.teamwork/logs/</text>
    <text class="f" x="454" y="474">ui-ux-engineer/</text>
  </g>
  <path class="ct" d="M610,376 H652"/>
  <rect class="chip" x="652" y="342" width="216" height="74" rx="8"/>
  <text class="f" x="666" y="365">.teamwork/logs/</text>
  <text class="f" x="666" y="384">&lt;role&gt;/</text>
  <text class="m" x="666" y="406">one log folder per member</text>
  <path class="ln" d="M360,504 V528" marker-end="url(#a)"/>

  <!-- 4 review -->
  <rect class="lead" x="110" y="530" width="500" height="64" rx="12"/>
  <text class="b" x="130" y="556">4  Team lead reviews each handoff</text>
  <text class="m" x="130" y="579">checked against the plan; sent back if short</text>
  <path class="ln" d="M610,562 H632 V440 H612" marker-end="url(#a)"/>
  <text class="m" x="642" y="504">sent back</text>
  <path class="ln" d="M360,594 V626" marker-end="url(#a)"/>

  <!-- 5 QA -->
  <rect class="mem" x="110" y="628" width="500" height="64" rx="12"/>
  <text class="b" x="130" y="654">5  QA verdict before "done"</text>
  <text class="m" x="130" y="677">qa-engineer, when on the team or the work changes code</text>
  <path class="ln" d="M360,692 V724" marker-end="url(#a)"/>

  <!-- 6 report -->
  <rect class="lead" x="110" y="726" width="500" height="84" rx="12"/>
  <text class="b" x="130" y="752">6  Team lead reports</text>
  <text class="m" x="130" y="775">done, verified, open, decisions needed</text>
  <text class="m" x="130" y="796">nothing is committed or pushed unless you ask</text>
  <path class="ct" d="M610,768 H652"/>
  <rect class="chip" x="652" y="732" width="216" height="74" rx="8"/>
  <text class="f" x="666" y="755">.teamwork/logs/</text>
  <text class="f" x="666" y="774">team-lead/</text>
  <text class="m" x="666" y="796">the lead's own log</text>
  <path class="ln" d="M360,810 V842" marker-end="url(#a)"/>

  <rect class="mem" x="110" y="844" width="500" height="54" rx="12"/>
  <text class="b" x="130" y="877">You read the report and decide what is open</text>

  <!-- escalation -->
  <path class="esc" d="M110,452 H76 V59 H104" marker-end="url(#ae)"/>
  <path class="esc" d="M76,160 H104" marker-end="url(#ae)"/>
  <text x="52" y="452" transform="rotate(-90 52 452)" style="fill:#9a5b00;font-size:14px;font-weight:600">escalations: options, tradeoffs, recommendation</text>

  <!-- legend -->
  <g transform="translate(110,926)">
    <rect class="lead" x="0" y="-12" width="22" height="16" rx="4"/>
    <text class="m" x="30" y="1">team lead (your main session)</text>
    <rect class="mem" x="250" y="-12" width="22" height="16" rx="4"/>
    <text class="m" x="280" y="1">you</text>
    <rect class="mem" x="340" y="-12" width="22" height="16" rx="4"/>
    <text class="m" x="370" y="1">members (subagents)</text>
    <path class="esc" d="M570,-4 H600"/>
    <text class="m" x="608" y="1">escalation</text>
  </g>
</svg>
