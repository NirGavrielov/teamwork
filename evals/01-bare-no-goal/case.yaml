schema_version: "1.0"
name: 01-bare-no-goal
description: Bare /teamwork with no goal asks for one and does nothing else (spec 8; bug bare-teamwork-unknown-command).
tags: [teamwork, plan-only]
execution:
  prompt: "/teamwork"
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
runs: 1
graders:
  - name: asks-a-question
    type: regex
    target: last_message
    pattern: '\?'
  - name: no-files-written
    type: file_exists
    path: "**"
    exists: false
  - name: no-delegation
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: asks-for-goal
    type: llm
    focus: last_message
    criteria: "The reply asks the user what the goal is in one short question AND mentions that a team size or roles can be added (for example \"team of 3\" or \"with QA\"); that hint proves the /teamwork skill ran rather than a generic reply. It does not write a plan, pick a team, or start any work."
