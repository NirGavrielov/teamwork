schema_version: "1.0"
name: 03-team-of-3
description: 'team of 3 gives exactly 3 distinct members, and tasks name the files they own (spec 10, F5).'
tags: [teamwork, plan-only, sizing]
execution:
  prompt: "/teamwork add a hello-world Python CLI with a unit test and a README, team of 3. Stop after writing and showing the plan; do not delegate."
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
runs: 1
graders:
  - name: plan-in-job-dir
    type: file_exists
    path: ".teamwork/jobs/*/plan.md"
  - name: no-delegation
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: exactly-three-members
    type: llm
    focus: last_message
    criteria: "The plan's team lists exactly 3 distinct members (the team lead does not count), and each of them owns at least one task."
  - name: file-ownership
    type: llm
    focus: last_message
    criteria: "Each task in the plan names the files or directories it may change, and no two tasks planned to run in parallel share a file."
