schema_version: "1.0"
name: 04-roles-only-no-qa
description: Roles only, without QA, on a code change. Exactly the named roles; QA is not added; the lead says it verifies itself (spec 11, F3).
tags: [teamwork, plan-only, sizing]
execution:
  prompt: "/teamwork add a hello-world Python CLI with a unit test, with the product manager and the software engineer. Stop after writing and showing the plan; do not delegate."
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
runs: 1
graders:
  - name: plan-in-job-dir
    type: file_exists
    path: ".teamwork/jobs/*/plan.md"
  - name: no-delegation
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: exactly-named-roles
    type: llm
    focus: last_message
    criteria: "The plan's team is exactly the product manager and the software engineer. The QA engineer is NOT on the team (a one-line suggestion to add a role is fine, but it must not be added). If the reply says how the work will be verified, it says the team lead verifies it (for example by running the tests), not a QA engineer."
