schema_version: "1.0"
name: 07-solo
description: Solo runs the whole job with no delegation and still writes the plan, the team-lead log, and the no-QA line (spec 14, F3, F6).
tags: [teamwork, full-run, sizing, layout]
execution:
  prompt: "/teamwork create hello.py that prints hello world, solo."
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
runs: 1
graders:
  - name: no-delegation
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: plan-in-job-dir
    type: file_exists
    path: ".teamwork/jobs/*/plan.md"
  - name: lead-log-in-job-dir
    type: file_exists
    path: ".teamwork/jobs/*/logs/team-lead.md"
  - name: work-done
    type: file_exists
    path: "**/hello.py"
  - name: no-qa-verdict-line
    type: regex
    target: last_message
    pattern: 'no QA verdict'
    flags: i
