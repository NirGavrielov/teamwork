schema_version: "1.0"
name: 08-roles-raise-size
description: More roles than the size - the roles win and the lead says the size was raised (spec 13).
tags: [teamwork, plan-only, sizing]
execution:
  prompt: "/teamwork add a hello-world Python CLI with a unit test, team of 1 with the product manager and the QA engineer. Stop after writing and showing the plan; do not delegate."
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
runs: 1
graders:
  - name: plan-in-job-dir
    type: file_exists
    path: ".teamwork/jobs/*/plan.md"
  - name: no-delegation
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: roles-win
    type: llm
    focus: last_message
    criteria: "The plan's team includes both the product manager and the QA engineer, and the reply says (in any wording) that the requested size of 1 was raised to match the named roles."
