schema_version: "1.0"
name: 12-same-goal-distinct-ids
description: A second same-day job with the same goal gets a distinct job id (-2 suffix) and never overwrites the earlier job's plan (F6).
tags: [teamwork, plan-only, layout, fixtures]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/teamwork add a hello CLI, team of 1. This is a new job, separate from any earlier one. Stop after writing and showing the plan; do not delegate."
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
runs: 1
graders:
  - name: new-plan-created
    type: file_exists
    path: ".teamwork/jobs/*/plan.md"
  - name: suffixed-job-id
    type: regex
    target: files
    pattern: '\.teamwork/jobs/\d{4}-\d{2}-\d{2}-[a-z0-9-]+-[2-9]/plan\.md'
  - name: no-delegation
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
