schema_version: "1.0"
name: 17-high-risk-explicit-roles
description: A high-risk change with an explicit role list keeps the requested team (no reviewer added) and names the check the lead will run itself instead (review rules - tiers vs explicit roles).
tags: [teamwork, plan-only, review, sizing]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/teamwork move the hard-coded secret in config.py to an environment variable, with the software engineer only. Stop after writing and showing the plan; do not delegate."
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
runs: 1
graders:
  - name: plan-in-job-dir
    type: file_exists
    path: ".teamwork/jobs/*/plan.md"
  - name: no-delegation
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: keeps-team-names-own-check
    type: llm
    focus: last_message
    criteria: "The plan's team is exactly the software engineer (the privacy and security reviewer and QA are not added), the change is rated High risk because it handles a secret, and the plan names the security check the lead will run itself instead (for example /security-review or its own review of the diff) and that the user's OK is needed before done."
