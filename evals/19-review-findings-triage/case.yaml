schema_version: "1.0"
name: 19-review-findings-triage
description: Review findings are verified against the code before acting - the false one dropped, the style-only nit dropped, the pre-existing bug logged not blocked, the real bug fixed - and each is accounted for (review rules - findings).
tags: [teamwork, full-run, review, fixtures]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/teamwork triage the automated reviewer findings in FINDINGS.md for calc.py and act on the ones that hold up, solo."
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
runs: 1
graders:
  - name: no-delegation
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: real-bug-fixed
    type: regex
    target: {source: file, path: calc.py}
    pattern: 'len\(xs\)\s*\+\s*1'
    match: not_contains
  - name: false-finding-not-acted-on
    type: llm
    focus: last_message
    criteria: "The report says finding 2 does not apply or was not acted on because calc.py has no parse_input() function."
  - name: style-nit-not-acted-on
    type: regex
    target: {source: file, path: calc.py}
    pattern: 'def average\(xs\)'
    match: contains
  - name: pre-existing-logged
    type: llm
    focus: last_message
    criteria: "The report treats finding 4 (ratio divides by zero) as pre-existing or not introduced by the change, and leaves it open or logged rather than blocking on it."
  - name: fix-verified
    type: llm
    focus: last_message
    criteria: "The report says finding 1 (average adds 1) was fixed and says how the fix was checked, for example by running average on sample input, with the result."
